aid: words
name: Words API
description: >-
  Words API is a RESTful English-language API that provides definitions, synonyms, antonyms, related words, syllables,
  pronunciation (IPA), rhymes, frequency, and hierarchical lexical relationships (typeOf, hasTypes, partOf, hasParts,
  memberOf, similarTo, also, entails, inCategory, inRegion, pertainsTo, etc.) for more than 150,000 English words.
  Distributed and metered through the RapidAPI marketplace.
url: https://www.wordsapi.com/docs/
baseURL: https://wordsapiv1.p.rapidapi.com
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://www.wordsapi.com/img/logo.png
specificationVersion: '0.23'
created: '2026-05-28'
modified: '2026-05-30'
